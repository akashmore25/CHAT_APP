stages:
  - deploy

deploy_to_ec2:
  stage: deploy
  only:
    - main

  before_script:
    - apt-get update -y
    - apt-get install -y openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts

  script:
    - |
      ssh $SERVER_USER@$SERVER_IP << 'EOF'
        set -e

        cd ~/my-mern-app
        git pull origin main

        cd backend
        npm install
        pm2 restart mern-backend || pm2 start src/index.js --name mern-backend

        cd ../frontend
        npm install
        npm run build

        sudo rm -rf /var/www/html/*
        sudo cp -r dist/* /var/www/html/
      EOF